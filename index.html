<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HachiwareMarket</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1f8;--card:#fff;--tx:#1b1625;--mu:#6b6479;--ac:#7c3aed;--bd:#e4def0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0b14;--card:#181322;--tx:#f1ecfa;--mu:#9a90ad;--ac:#a78bfa;--bd:#2a2238}}
:root[data-theme="dark"]{--bg:#0e0b14;--card:#181322;--tx:#f1ecfa;--mu:#9a90ad;--ac:#a78bfa;--bd:#2a2238}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5}
.w{max-width:960px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.6rem}
.tag{color:var(--mu);margin:4px 0 0}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.chips button{padding:6px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.em{font-size:2rem}
.card h3{margin:0;font-size:1.05rem}
.card p{margin:0;color:var(--mu);font-size:.9rem;flex:1}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pr b{font-size:1.15rem}
.pan{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:24px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--bd)}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
label{display:block;margin:12px 0 4px;font-size:.9rem;color:var(--mu)}
.pm{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pm label{margin:0;border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;color:var(--tx)}
.pm input{width:auto;margin-right:6px}
.pm small{display:block;color:var(--mu)}
.note{font-size:.8rem;color:var(--mu);margin-top:12px}
.ar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin:6px 0;padding:8px;border:1px solid var(--bd);border-radius:10px}
h3.s{margin:18px 0 4px}
.x{background:none;color:var(--mu);padding:0 6px}
</style>
</head>
<body>
<div class="w">
<header>
  <div><h1 id="name"></h1><p class="tag" id="tag"></p></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="user" style="display:flex;align-items:center;gap:8px"></span>
    <button id="adminBtn" class="g" style="display:none">Admin</button>
    <button id="login">Login with Discord</button>
    <a class="btn g" id="discord" target="_blank" rel="noopener" style="background:transparent;color:var(--tx);border:1px solid var(--bd)">Server</a>
  </div>
</header>
<div class="pan" id="admin" style="display:none"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>

<div class="pan" id="checkout">
  <h2 style="margin-top:0">Checkout</h2>
  <div id="cart"></div>
  <label for="ign">Minecraft username</label>
  <input id="ign" placeholder="Your in-game name" autocomplete="off">
  <label for="mail">Contact (Discord or email)</label>
  <input id="mail" placeholder="So we can reach you for delivery">
  <label>Payment method</label>
  <div class="pm" id="pm"></div>
  <p style="margin:16px 0 0"><button id="pay">Pay</button></p>
  <p class="note" id="msg"></p>
</div>
</div>

<script>
/* ============ EDIT THIS SECTION TO CUSTOMIZE ============ */
let SITE = {
  name: "Donut Black Market",
  tagline: "Items, currency and bundles for DonutSMP",
  discord: "https://discord.gg/yourinvite",
  currency: "$"
};

/* Discord login: paste your Application (Client) ID from discord.com/developers.
   In OAuth2 > Redirects add the exact URL where this page is hosted. */
const DISCORD = { clientId: "1555582133282537502" };

/* Admin: Discord IDs allowed to see the Admin panel, and the repo it publishes to. */
const ADMIN_IDS = ["1459632152529338392"];
const GITHUB = { repo: "A-Yapper-Real/Hachiware-Market", path: "config.json", branch: "main" };

/* Add / remove / edit offers here. One line per offer. */
let OFFERS = [
  { id:"cash-100m", cat:"Currency", emoji:"💰", title:"100M Money",   desc:"Delivered in-game within minutes.", price:5 },
  { id:"cash-500m", cat:"Currency", emoji:"💰", title:"500M Money",   desc:"Best value currency pack.",        price:22 },
  { id:"shards-1k", cat:"Shards",   emoji:"💎", title:"1,000 Shards", desc:"Shard top-up.",                    price:8 },
  { id:"elytra",    cat:"Items",    emoji:"🪽", title:"Elytra",       desc:"Ready to fly.",                    price:6 },
  { id:"netherite", cat:"Items",    emoji:"🛡️", title:"Netherite Set",desc:"Full armor set.",                  price:12 },
  { id:"spawner",   cat:"Items",    emoji:"🔥", title:"Spawner x1",   desc:"Choose type on Discord.",          price:15 }
];

/* Payment methods. Put each provider's payment link / checkout URL in "url".
   {amount}, {order}, {ign} get replaced automatically.
   Leave url empty to show "contact us" instead. */
let METHODS = [
  { id:"card",   name:"Card",    note:"Visa / MC / MIR", url:"" },
  { id:"mir",    name:"MIR",     note:"Russian cards",   url:"" },
  { id:"sbp",    name:"SBP",     note:"Fast payments",   url:"" },
  { id:"crypto", name:"Crypto",  note:"USDT / BTC / ETH",url:"" },
  { id:"paypal", name:"PayPal",  note:"",                url:"" }
];
/* ======================================================== */

const $ = id => document.getElementById(id);
const cart = {}; let cat = "All", method = METHODS[0].id;
const money = n => SITE.currency + n.toFixed(2);

function applySite(){
  document.title = SITE.name;
  $("name").textContent = SITE.name; $("tag").textContent = SITE.tagline; $("discord").href = SITE.discord;
}

function drawChips(){
  const cats = ["All", ...new Set(OFFERS.map(o => o.cat))];
  $("chips").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.textContent = c; if (c !== cat) b.className = "g";
    b.onclick = () => { cat = c; drawChips(); drawGrid(); };
    $("chips").append(b);
  });
}
function drawGrid(){
  $("grid").innerHTML = "";
  OFFERS.filter(o => cat === "All" || o.cat === cat).forEach(o => {
    const d = document.createElement("div"); d.className = "card";
    d.innerHTML = `<div class="em">${o.emoji}</div><h3></h3><p></p><div class="pr"><b>${money(o.price)}</b><button>Add</button></div>`;
    d.querySelector("h3").textContent = o.title; d.querySelector("p").textContent = o.desc;
    d.querySelector("button").onclick = () => { cart[o.id] = (cart[o.id] || 0) + 1; drawCart(); $("checkout").scrollIntoView({behavior:"smooth"}); };
    $("grid").append(d);
  });
}
function total(){ return OFFERS.reduce((s,o) => s + (cart[o.id] || 0) * o.price, 0); }
function drawCart(){
  const items = OFFERS.filter(o => cart[o.id]);
  $("cart").innerHTML = items.length ? "" : '<p class="note">Your cart is empty.</p>';
  items.forEach(o => {
    const r = document.createElement("div"); r.className = "row";
    r.innerHTML = `<span></span><span><button class="x g">−</button> <b>${cart[o.id]}</b> <button class="x g">+</button> ${money(o.price*cart[o.id])}</span>`;
    r.firstChild.textContent = o.title;
    const [m,p] = r.querySelectorAll("button");
    m.onclick = () => { if(--cart[o.id] <= 0) delete cart[o.id]; drawCart(); };
    p.onclick = () => { cart[o.id]++; drawCart(); };
    $("cart").append(r);
  });
  if (items.length){ const t = document.createElement("div"); t.className = "row"; t.innerHTML = `<b>Total</b><b>${money(total())}</b>`; $("cart").append(t); }
  $("pay").disabled = !items.length;
}
function drawMethods(){
  $("pm").innerHTML = "";
  METHODS.forEach(m => {
    const l = document.createElement("label");
    l.innerHTML = `<input type="radio" name="pm" ${m.id === method ? "checked" : ""}>${m.name}<small>${m.note || ""}</small>`;
    l.querySelector("input").onchange = () => method = m.id;
    $("pm").append(l);
  });
}
$("pay").onclick = () => {
  const ign = $("ign").value.trim(), mail = $("mail").value.trim();
  if (!/^[A-Za-z0-9_.]{3,16}$/.test(ign)) return $("msg").textContent = "Enter a valid Minecraft username.";
  if (!mail) return $("msg").textContent = "Add a contact so we can deliver your order.";
  const m = METHODS.find(x => x.id === method), order = "ORD-" + Date.now().toString(36).toUpperCase();
  const who = me ? ` [Discord: ${me.username} / ${me.id}]` : "";
  const summary = OFFERS.filter(o => cart[o.id]).map(o => cart[o.id] + "x " + o.title).join(", ");
  if (!m.url){
    $("msg").textContent = `Order ${order}: ${summary} = ${money(total())} for ${ign}${who}. Send this to us on Discord to pay via ${m.name}.`;
    return;
  }
  location.href = m.url.replace("{amount}", total().toFixed(2)).replace("{order}", order).replace("{ign}", encodeURIComponent(ign));
};

/* ---- Discord login (no server; works only when hosted on your own site) ---- */
let me = null;
const redirect = location.origin + location.pathname;
try { me = JSON.parse(localStorage.getItem("dm_user") || "null"); } catch(e){}
function drawUser(){
  $("user").innerHTML = ""; $("login").style.display = me ? "none" : "";
  $("adminBtn").style.display = me && ADMIN_IDS.includes(me.id) ? "" : "none";
  if (!me) return;
  const img = document.createElement("img");
  img.src = me.avatar ? `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=64` : "https://cdn.discordapp.com/embed/avatars/0.png";
  img.width = img.height = 28; img.style.borderRadius = "50%";
  const n = document.createElement("span"); n.textContent = me.global_name || me.username;
  const o = document.createElement("button"); o.className = "g"; o.textContent = "Log out";
  o.onclick = () => { me = null; try { localStorage.removeItem("dm_user"); } catch(e){} drawUser(); };
  $("user").append(img, n, o);
  if (!$("mail").value) $("mail").value = "Discord: " + me.username;
}
$("login").onclick = () => {
  if (!DISCORD.clientId) return alert("Set DISCORD.clientId in the config first.");
  const st = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem("dm_state", st); } catch(e){}
  location.href = "https://discord.com/oauth2/authorize?response_type=token&scope=identify&client_id=" + DISCORD.clientId +
    "&redirect_uri=" + encodeURIComponent(redirect) + "&state=" + st;
};
(async () => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token")) {
    let ok = false; try { ok = h.get("state") === sessionStorage.getItem("dm_state"); } catch(e){}
    history.replaceState(null, "", location.pathname);
    if (ok) try {
      const r = await fetch("https://discord.com/api/users/@me", { headers: { Authorization: "Bearer " + h.get("access_token") } });
      me = await r.json(); localStorage.setItem("dm_user", JSON.stringify(me));
    } catch(e){}
  }
  drawUser();
})();


/* ---- Admin panel: edit everything, publish to GitHub as config.json ---- */
function refresh(){ applySite(); if(cat!=="All" && !OFFERS.some(o=>o.cat===cat)) cat="All"; if(!METHODS.some(m=>m.id===method)) method=METHODS[0]&&METHODS[0].id; drawChips(); drawGrid(); drawMethods(); drawCart(); }
function fld(obj,key,ph,num){
  const i=document.createElement("input"); i.value=obj[key]==null?"":obj[key]; i.placeholder=ph; i.title=ph;
  i.oninput=()=>{ obj[key]= num ? (parseFloat(i.value)||0) : i.value; refresh(); }; return i;
}
function rowOf(obj,keys,list,i){
  const r=document.createElement("div"); r.className="ar";
  keys.forEach(([k,ph,n])=>r.append(fld(obj,k,ph,n)));
  const d=document.createElement("button"); d.className="g"; d.textContent="Delete";
  d.onclick=()=>{ list.splice(i,1); drawAdmin(); refresh(); }; r.append(d); return r;
}
function say(t){ const m=$("amsg"); if(m) m.textContent=t; }
function drawAdmin(){
  const a=$("admin"); a.innerHTML="<h2 style='margin-top:0'>Admin</h2><h3 class='s'>Site</h3>";
  const site=document.createElement("div"); site.className="ar";
  [["name","Site name"],["tagline","Tagline"],["discord","Discord invite link"],["currency","Currency symbol"]].forEach(([k,ph])=>site.append(fld(SITE,k,ph)));
  a.append(site);
  a.insertAdjacentHTML("beforeend","<h3 class='s'>Offers</h3>");
  OFFERS.forEach((o,i)=>a.append(rowOf(o,[["id","Unique id"],["cat","Category"],["emoji","Emoji"],["title","Title"],["desc","Description"],["price","Price",true]],OFFERS,i)));
  const ao=document.createElement("button"); ao.className="g"; ao.textContent="+ Add offer";
  ao.onclick=()=>{ OFFERS.push({id:"offer-"+Date.now().toString(36),cat:"Items",emoji:"🎁",title:"New offer",desc:"",price:1}); drawAdmin(); refresh(); };
  a.append(ao);
  a.insertAdjacentHTML("beforeend","<h3 class='s'>Payment methods</h3>");
  METHODS.forEach((m,i)=>a.append(rowOf(m,[["id","Unique id"],["name","Name"],["note","Note"],["url","Payment link"]],METHODS,i)));
  const am=document.createElement("button"); am.className="g"; am.textContent="+ Add method";
  am.onclick=()=>{ METHODS.push({id:"m-"+Date.now().toString(36),name:"New",note:"",url:""}); drawAdmin(); refresh(); };
  a.append(am);
  a.insertAdjacentHTML("beforeend","<h3 class='s'>Publish</h3><input id='ghtok' type='password' placeholder='GitHub token (not saved anywhere)' autocomplete='off'><p style='display:flex;gap:8px;flex-wrap:wrap'><button id='pub'>Save &amp; publish for everyone</button><button id='dl' class='g'>Download config.json</button></p><p class='note' id='amsg'></p>");
  $("pub").onclick=publish; $("dl").onclick=()=>{
    const b=new Blob([cfgText()],{type:"application/json"}), l=document.createElement("a");
    l.href=URL.createObjectURL(b); l.download="config.json"; l.click();
  };
}
function cfgText(){ return JSON.stringify({site:SITE,offers:OFFERS,methods:METHODS},null,2); }
async function publish(){
  const tok=$("ghtok").value.trim(); if(!tok) return say("Paste your GitHub token first.");
  const api=`https://api.github.com/repos/${GITHUB.repo}/contents/${GITHUB.path}`;
  const H={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
  say("Publishing...");
  try{
    let sha; const g=await fetch(api+"?ref="+GITHUB.branch,{headers:H}); if(g.ok) sha=(await g.json()).sha;
    const body={message:"Update shop config",branch:GITHUB.branch,content:btoa(unescape(encodeURIComponent(cfgText()))),sha};
    const p=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify(body)});
    say(p.ok ? "Published! Visitors see it in about a minute." : "Failed: "+((await p.json()).message||p.status));
  }catch(e){ say("Network error, try again."); }
}
$("adminBtn").onclick=()=>{ const a=$("admin"); const open=a.style.display==="none"; a.style.display=open?"":"none"; if(open) drawAdmin(); };
async function loadConfig(){
  try{
    const r=await fetch(GITHUB.path+"?t="+Date.now());
    if(r.ok){ const c=await r.json(); if(c.site) SITE=c.site; if(c.offers) OFFERS=c.offers; if(c.methods) METHODS=c.methods; }
  }catch(e){}
  refresh();
}
loadConfig();
</script>
</body>
</html>
